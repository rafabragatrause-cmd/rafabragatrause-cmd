<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="t d">
  <title id="t">Rafael Braga</title>
  <desc id="d">Banner preto e laranja: Rafael Braga. Eu construo o sistema que o seu negócio ainda faz na mão. Claude Code e Codex.</desc>
  <defs>
    <radialGradient id="bg" cx=".78" cy=".35" r=".85"><stop stop-color="#ff6a1f"/><stop offset=".22" stop-color="#c23604"/><stop offset=".5" stop-color="#3a0e02"/><stop offset="1" stop-color="#070403"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <style>
      text{font-family:"Inter Tight",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
      .m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
      .r{animation:r .9s cubic-bezier(.2,.8,.2,1) backwards}.r2{animation-delay:.15s}.r3{animation-delay:.3s}
      .orb{transform-origin:1240px 260px;animation:o 40s linear infinite}
      @keyframes r{from{opacity:0;transform:translateY(16px)}}
      @keyframes o{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <g class="orb" fill="none" stroke="#fff"><circle cx="1240" cy="260" r="190" stroke-opacity=".14" stroke-dasharray="2 10"/><circle cx="1240" cy="260" r="120" stroke-opacity=".1"/></g>
  <g class="r"><text x="96" y="128" class="m" font-size="18" fill="#ffb07a" letter-spacing="2">› SISTEMA ANTES DE GENTE.</text></g>
  <g class="r r2"><text x="90" y="250" font-size="112" font-weight="800" fill="#f7f4ef" letter-spacing="-5">Rafael Braga</text></g>
  <g class="r r3">
    <text x="96" y="318" font-size="30" font-weight="500" fill="#f7f4ef" fill-opacity=".86">Eu construo o sistema que o seu negócio ainda faz na mão.</text>
    <text x="96" y="400" class="m" font-size="17" fill="#f7f4ef" fill-opacity=".6" letter-spacing="1">CLAUDE CODE · CODEX · SISTEMAS SOB MEDIDA · MARKETING</text>
  </g>
  <g transform="translate(1110 130)">
    <rect width="260" height="74" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".35"/>
    <rect x="16" y="18" width="38" height="38" rx="10" fill="#fff" fill-opacity=".92"/><text x="35" y="43" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#ff5a14">›_</text>
    <text x="70" y="35" font-size="19" font-weight="700" fill="#fff">Claude Code</text><text x="70" y="57" font-size="14" fill="#fff" fill-opacity=".75">constrói o sistema</text>
  </g>
  <g transform="translate(1170 300)">
    <rect width="240" height="74" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".35"/>
    <rect x="16" y="18" width="38" height="38" rx="10" fill="#fff" fill-opacity=".92"/><text x="35" y="43" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#ff5a14">{}</text>
    <text x="70" y="35" font-size="19" font-weight="700" fill="#fff">Codex</text><text x="70" y="57" font-size="14" fill="#fff" fill-opacity=".75">revisa o que foi feito</text>
  </g>
</svg>
